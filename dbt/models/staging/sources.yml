version: 2

sources:
  - name: raw_lake
    description: >
      Raw data lake — Hive-partitioned Parquet files written by the ETL pipeline.
      Each ticker/date combination is one file under year=/month=/day= directories.
    meta:
      owner: data-team
    freshness:
      warn_after:  {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    loaded_at_field: _extracted_at

    tables:
      - name: raw_prices
        description: "Daily OHLCV price history extracted from Yahoo Finance API."
        columns:
          - name: ticker
            description: "Stock ticker symbol (e.g. AAPL)."
          - name: Date
            description: "Trading date."
          - name: Open
            description: "Opening price (adjusted)."
          - name: High
            description: "Intraday high (adjusted)."
          - name: Low
            description: "Intraday low (adjusted)."
          - name: Close
            description: "Closing price (adjusted)."
          - name: Volume
            description: "Number of shares traded."
          - name: _extracted_at
            description: "UTC timestamp when this row was fetched from the API."

      - name: raw_company_info
        description: "Company metadata snapshot extracted from Yahoo Finance API."
        columns:
          - name: ticker
            description: "Stock ticker symbol."
          - name: company_name
            description: "Full legal company name."
          - name: sector
            description: "GICS sector classification."
          - name: industry
            description: "GICS industry classification."
          - name: market_cap
            description: "Market capitalisation in USD at time of extraction."
