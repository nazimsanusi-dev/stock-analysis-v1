name: Data Engineering Pipeline

on:
  push:
    branches: [main]
    paths:
      - "etl/**"
      - "dbt/**"
      - "airflow/**"
      - "requirements*.txt"
      - ".github/workflows/pipeline.yml"
  schedule:
    - cron: "0 1 * * 1-5"   # 01:00 UTC Mon–Fri (mirrors the Airflow DAG schedule)
  workflow_dispatch:
    inputs:
      run_date:
        description: "Logical date for ETL run (YYYY-MM-DD). Defaults to yesterday."
        required: false
        type: string

env:
  PYTHONPATH:       ${{ github.workspace }}
  DATA_LAKE_PATH:   ${{ github.workspace }}/data/lake
  WAREHOUSE_PATH:   ${{ github.workspace }}/warehouse/stock_analytics.duckdb
  DBT_PROJECT_DIR:  ${{ github.workspace }}/dbt
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  DBT_TARGET:       staging

jobs:

  # ── Job 1: Extract → Transform → Load ──────────────────────────────────────
  etl:
    name: ETL — Extract / Transform / Load
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ETL dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q \
            pyarrow==15.0.2 \
            tenacity==8.2.3

      - name: Run ETL pipeline
        env:
          SCREENER_TICKERS: ${{ secrets.SCREENER_TICKERS }}
        run: |
          python -m etl.run_pipeline ${{ inputs.run_date }}

      - name: Upload Parquet lake
        uses: actions/upload-artifact@v4
        with:
          name: data-lake-${{ github.run_id }}
          path: data/lake/
          if-no-files-found: warn

  # ── Job 2: dbt transform chain ─────────────────────────────────────────────
  dbt:
    name: dbt — Staging → Intermediate → Snapshots → Marts → Test → Docs
    runs-on: ubuntu-latest
    needs: etl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt + ETL dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q \
            dbt-duckdb==1.8.4 \
            duckdb==0.10.3 \
            pyarrow==15.0.2 \
            pandas==2.2.3 \
            yfinance==0.2.51 \
            tenacity==8.2.3

      - name: Download Parquet lake from ETL job
        uses: actions/download-artifact@v4
        with:
          name: data-lake-${{ github.run_id }}
          path: data/lake/

      - name: dbt deps
        run: cd dbt && dbt deps --profiles-dir .

      - name: dbt run — staging
        run: cd dbt && dbt run --select staging --profiles-dir . --target staging --no-use-colors

      - name: dbt run — intermediate
        run: cd dbt && dbt run --select intermediate --profiles-dir . --target staging --no-use-colors

      - name: dbt snapshot
        run: cd dbt && dbt snapshot --profiles-dir . --target staging --no-use-colors

      - name: dbt run — marts
        run: cd dbt && dbt run --select marts --profiles-dir . --target staging --no-use-colors

      - name: dbt test
        run: cd dbt && dbt test --profiles-dir . --target staging --no-use-colors

      - name: dbt docs generate
        run: cd dbt && dbt docs generate --profiles-dir . --target staging --no-use-colors

      - name: Upload dbt docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-${{ github.run_id }}
          path: dbt/target/
          if-no-files-found: warn
